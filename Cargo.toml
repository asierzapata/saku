[workspace]
resolver = "2"
members = [
    "crates/nte",
    "crates/saku-crypto",
    "crates/saku-server",
    "crates/saku-storage",
    "crates/saku-sync",
    "crates/tdo",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Asier Zapata <me@asierzapata.com>"]
publish = false

[workspace.dependencies]
# Internal dependencies
saku-crypto = { version = "0.1.0", path = "crates/saku-crypto" }
saku-storage = { version = "0.1.0", path = "crates/saku-storage" }
saku-sync = { version = "0.1.0", path = "crates/saku-sync" }

# Shared dependencies with versions
clap = { version = "4.5.58", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
jiff = { version = "0.2.20", features = ["serde"] }
fs2 = "0.4.3"
thiserror = "2.0.18"
dirs = "6.0.0"
colored = "2.1"
term_size = "0.3"
tempfile = "3.14"
argon2 = { version = "0.5", features = ["std"] }
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "windows-native"] }
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP / server dependencies
ureq = { version = "2", features = ["json"] }
toml = "0.8"
rpassword = "7"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "catch-panic"] }
jsonwebtoken = "9"
bcrypt = "0.17"
opendal = { version = "0.51", default-features = false, features = ["services-s3"] }
anyhow = "1"

# Tracing dependencies - optional for structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
