[workspace]
resolver = "2"
members = [
    "crates/nte",
    "crates/tdo",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Asier Zapata <me@asierzapata.com>"]

[workspace.dependencies]
# Shared dependencies with versions
clap = { version = "4.5.58", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
jiff = { version = "0.2.20", features = ["serde"] }
fs2 = "0.4.3"
thiserror = "2.0.18"
dirs = "6.0.0"
colored = "2.1"
term_size = "0.3"
tempfile = "3.14"

# Tracing dependencies - optional for structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
