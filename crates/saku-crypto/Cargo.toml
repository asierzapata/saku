[package]
name = "saku-crypto"
version = "0.3.0"
description = "End-to-end encryption for the saku sync system"
repository = "https://github.com/asierzapata/saku"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = true

[dependencies]
argon2.workspace = true
chacha20poly1305.workspace = true
rand.workspace = true
sha2.workspace = true
zeroize.workspace = true
thiserror.workspace = true
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "crypto-rust", "windows-native"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
keychain = ["dep:keyring", "dep:serde", "dep:serde_json"]
