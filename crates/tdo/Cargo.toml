[package]
name = "saku-tdo"
version = "0.3.1"
description = "A minimal and clean task manager for your terminal"
repository = "https://github.com/asierzapata/saku"
homepage = "https://asierzapata.github.io/saku/"
keywords = ["cli", "task-manager", "todo", "productivity", "terminal"]
categories = ["command-line-utilities"]
readme = "README.md"
authors.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tdo"
path = "src/main.rs"

[features]
default = []  # No logging by default for zero overhead in release builds
logging = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-appender"]

[dependencies]
# Logging dependencies - optional, disabled by default
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
jiff.workspace = true
fs2.workspace = true
thiserror.workspace = true
dirs.workspace = true
colored.workspace = true
term_size.workspace = true
tempfile.workspace = true

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
