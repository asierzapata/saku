[package]
name = "tdo"
version = "0.1.0"
description = "A minimal and clean task manager for your terminal"
repository = "https://github.com/asierzapata/saku"
homepage = "https://asierzapata.github.io/saku/"
keywords = ["cli", "task-manager", "todo", "productivity", "terminal"]
categories = ["command-line-utilities"]
readme = "../../README.md"
authors.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tdo"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
jiff.workspace = true
fs2.workspace = true
thiserror.workspace = true
dirs.workspace = true
colored.workspace = true
slug.workspace = true
term_size.workspace = true
tempfile.workspace = true
