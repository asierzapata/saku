[package]
name = "saku-tdo"
version = "0.5.3"
description = "A minimal and clean task manager for your terminal"
repository = "https://github.com/asierzapata/saku"
homepage = "https://asierzapata.github.io/saku/"
keywords = ["cli", "task-manager", "todo", "productivity", "terminal"]
categories = ["command-line-utilities"]
readme = "README.md"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = true

[[bin]]
name = "tdo"
path = "src/main.rs"

[features]
default = ["sync"]
logging = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-appender"]
sync = ["saku-sync/server", "saku-crypto/keychain", "dep:rpassword", "dep:ureq"]

[dependencies]
# Logging dependencies - optional, disabled by default
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }
saku-storage.workspace = true
saku-sync.workspace = true
saku-crypto = { workspace = true, optional = true }
rpassword = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
clap.workspace = true
clap_complete = "4.5"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
jiff.workspace = true
fs2.workspace = true
thiserror.workspace = true
dirs.workspace = true
colored.workspace = true
term_size.workspace = true
tempfile.workspace = true

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
proptest = "1"
