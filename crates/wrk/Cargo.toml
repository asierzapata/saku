[package]
name = "saku-wrk"
version = "0.1.0"
description = "Agent task executor for the saku productivity suite"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "wrk"
path = "src/main.rs"

[dependencies]
saku-tdo = { path = "../tdo", default-features = false }
saku-storage.workspace = true
clap.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
