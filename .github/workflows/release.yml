name: Release Crate

on:
  workflow_dispatch:
    inputs:
      crate:
        description: 'Crate to release'
        required: true
        type: choice
        options:
          - tdo
          - nte
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set crate info
        id: crate-info
        run: |
          if [[ "${{ inputs.crate }}" == "tdo" ]]; then
            echo "package=saku-tdo" >> $GITHUB_OUTPUT
            echo "path=crates/tdo" >> $GITHUB_OUTPUT
            echo "tag_prefix=saku-tdo-v" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.crate }}" == "nte" ]]; then
            echo "package=saku-nte" >> $GITHUB_OUTPUT
            echo "path=crates/nte" >> $GITHUB_OUTPUT
            echo "tag_prefix=saku-nte-v" >> $GITHUB_OUTPUT
          fi

      - name: Get current version
        id: current-version
        run: |
          VERSION=$(grep '^version = ' ${{ steps.crate-info.outputs.path }}/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Compute new version
        id: new-version
        run: |
          CURRENT="${{ steps.current-version.outputs.version }}"
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)

          case "${{ inputs.bump }}" in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=${{ steps.crate-info.outputs.tag_prefix }}${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Bump version in Cargo.toml
        run: |
          sed -i 's/^version = "${{ steps.current-version.outputs.version }}"/version = "${{ steps.new-version.outputs.version }}"/' \
            ${{ steps.crate-info.outputs.path }}/Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update Cargo.lock
        run: cargo update -p ${{ steps.crate-info.outputs.package }}

      - name: Get last tag
        id: last-tag
        run: |
          LAST_TAG=$(git tag --list "${{ steps.crate-info.outputs.tag_prefix }}*" --sort=-version:refname | head -1)
          echo "tag=$LAST_TAG" >> $GITHUB_OUTPUT
          echo "Last tag: ${LAST_TAG:-'(none, first release)'}"

      - name: Generate changelog
        run: |
          LAST_TAG="${{ steps.last-tag.outputs.tag }}"
          NEW_TAG="${{ steps.new-version.outputs.tag }}"

          if [[ -z "$LAST_TAG" ]]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log "${LAST_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          fi

          {
            echo "## What's Changed"
            echo ""
            if [[ -z "$COMMITS" ]]; then
              echo "- No changes since last release"
            else
              echo "$COMMITS"
            fi
            echo ""
            if [[ -n "$LAST_TAG" ]]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...${NEW_TAG}"
            fi
          } > changelog.md

          cat changelog.md

      - name: Commit version bump
        run: |
          git add ${{ steps.crate-info.outputs.path }}/Cargo.toml Cargo.lock
          git commit -m "chore(release): bump ${{ inputs.crate }} to v${{ steps.new-version.outputs.version }}"

      - name: Create and push tag
        run: |
          TAG="${{ steps.new-version.outputs.tag }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin main
          git push origin "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.new-version.outputs.tag }}" \
            --title "${{ steps.new-version.outputs.tag }}" \
            --notes-file changelog.md
